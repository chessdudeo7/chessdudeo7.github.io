  var css = getComputedStyle(document.documentElement);
  var LANE_W = parseFloat(css.getPropertyValue("--lane-w"));
  var ROW = parseFloat(css.getPropertyValue("--row"));

  var logEl = document.getElementById("log");
  var rails = document.getElementById("rails");
  var showEl = document.getElementById("show");
  var showInner = document.getElementById("show-inner");
  var enabled = {};
  var selected = null;
  var rows = [];

  Object.keys(BRANCHES).forEach(function (k) { enabled[k] = true; });

  function laneX(lane) { return 14 + lane * LANE_W; }
  function rowY(i) { return i * ROW + ROW / 2; }

  function el(tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }

  function visible() {
    return LOG.filter(function (c) {
      if (!enabled[c.br]) { return false; }
      if (c.merge && !enabled[c.merge]) { return false; }
      return true;
    });
  }

  /* ══ Draw the graph ══════════════════════════════════════════════════════ */
  function drawRails(list) {
    while (rails.firstChild) { rails.removeChild(rails.firstChild); }

    var h = list.length * ROW;
    rails.setAttribute("height", h);
    rails.setAttribute("width", laneX(6) + 8);
    rails.style.height = h + "px";

    /* A branch's rail runs from its newest appearance to its oldest. */
    var span = {};
    list.forEach(function (c, i) {
      [c.br, c.merge].forEach(function (b) {
        if (!b) { return; }
        if (!span[b]) { span[b] = [i, i]; }
        span[b][0] = Math.min(span[b][0], i);
        span[b][1] = Math.max(span[b][1], i);
      });
    });

    Object.keys(span).forEach(function (b) {
      var x = laneX(BRANCHES[b].lane);
      rails.appendChild(el("line", {
        x1: x, y1: rowY(span[b][0]), x2: x, y2: rowY(span[b][1]),
        stroke: BRANCHES[b].color, "stroke-width": 2, "stroke-linecap": "round", opacity: 0.85
      }));
    });

    list.forEach(function (c, i) {
      var cx = laneX(BRANCHES[c.br].lane);
      var cy = rowY(i);

      /* Merge: the incoming branch curves up into this commit. */
      if (c.merge && enabled[c.merge]) {
        var px = laneX(BRANCHES[c.merge].lane);
        rails.appendChild(el("path", {
          d: "M " + px + " " + (cy + ROW * 0.62) + " C " + px + " " + (cy + ROW * 0.16) +
             ", " + cx + " " + (cy + ROW * 0.34) + ", " + cx + " " + cy,
          fill: "none", stroke: BRANCHES[c.merge].color, "stroke-width": 2, opacity: 0.8
        }));
      }

      /* Branch root: fork downward into the branch it came from. */
      if (c.root && enabled[c.root]) {
        var fx = laneX(BRANCHES[c.root].lane);
        rails.appendChild(el("path", {
          d: "M " + cx + " " + cy + " C " + cx + " " + (cy + ROW * 0.34) +
             ", " + fx + " " + (cy + ROW * 0.16) + ", " + fx + " " + (cy + ROW * 0.62),
          fill: "none", stroke: BRANCHES[c.br].color, "stroke-width": 2, opacity: 0.8
        }));
      }

      var isMerge = !!c.merge;
      rails.appendChild(el("circle", {
        cx: cx, cy: cy, r: isMerge ? 6 : 5,
        fill: isMerge ? "#121520" : BRANCHES[c.br].color,
        stroke: BRANCHES[c.br].color, "stroke-width": isMerge ? 2.5 : 1.5
      }));
    });
  }

  /* ══ Rows ════════════════════════════════════════════════════════════════ */
  function render() {
    var list = visible();

    rows.forEach(function (r) { r.remove(); });
    rows = [];

    list.forEach(function (c, i) {
      var b = BRANCHES[c.br];
      var row = document.createElement("button");
      row.type = "button";
      row.className = "commit";
      row.style.setProperty("--c", b.color);
      row.setAttribute("aria-current", "false");

      var refs = (c.refs || []).map(function (r) {
        return '<span class="ref ' + (r[1] === "head" ? "ref-head" : "ref-tag") + '">' + r[0] + "</span>";
      }).join("");

      row.innerHTML =
        "<span></span>" +
        '<span class="commit-main">' +
          '<span class="commit-subject">' + c.subject + "</span>" +
          '<span class="commit-meta">' +
            '<span class="sha">' + c.sha + "</span>" +
            '<span class="sep">·</span><span>' + c.date + "</span>" +
            '<span class="sep">·</span><span>' + b.label + "</span>" +
            refs +
          "</span>" +
        "</span>";

      row.addEventListener("click", function () { select(c, list); });
      logEl.appendChild(row);
      rows.push(row);
    });

    logEl.style.height = (list.length * ROW) + "px";
    drawRails(list);

    document.getElementById("stat-count").textContent =
      list.length + " commits · " + Object.keys(enabled).filter(function (k) { return enabled[k]; }).length + " branches";

    if (selected) {
      var idx = list.indexOf(selected);
      if (idx >= 0) { rows[idx].setAttribute("aria-current", "true"); }
    }
  }

  /* ══ git show ════════════════════════════════════════════════════════════ */
  function select(c, list) {
    selected = c;
    list = list || visible();
    rows.forEach(function (r, i) {
      r.setAttribute("aria-current", list[i] === c ? "true" : "false");
    });

    var b = BRANCHES[c.br];
    showEl.style.setProperty("--c", b.color);

    var diff = c.diff.map(function (d) {
      var mark = d[0] === "a" ? "+" : d[0] === "d" ? "-" : " ";
      return '<div class="' + d[0] + '">' + mark + " " + d[1] + "</div>";
    }).join("");

    var links = (c.links || []).map(function (l) {
      return '<a class="lnk ' + (l[2] ? "" : "lnk-go") + '" href="' + l[1] + '">' + l[0] + "</a>";
    }).join("");

    showInner.innerHTML =
      '<div class="show-sha">commit <b>' + c.sha + "0f4c9e2b7d13a8" + "</b></div>" +
      '<h2 class="show-subject">' + c.subject + "</h2>" +
      '<div class="show-trailer">' +
        '<span class="k">Author:</span> Matthew Zhu &lt;m49zhu@uwaterloo.ca&gt;<br>' +
        '<span class="k">Date:</span>   ' + c.date + "<br>" +
        '<span class="k">Branch:</span> ' + b.label +
        (c.merge ? '<br><span class="k">Merge:</span>  ' + BRANCHES[c.merge].label + " → " + b.label : "") +
      "</div>" +
      (c.body ? '<div class="show-body">' + c.body + "</div>" : "") +
      '<div class="diff-label">Diff</div>' +
      '<div class="diff">' + diff + "</div>" +
      (links ? '<div class="show-links">' + links + "</div>" : "");

    showEl.classList.add("open");
  }

  /* Below 1100px the detail pane is a full-screen sheet rather than a column,
     so it must never open by itself — the graph has to be what you land on. */

      '<div class="diff-label">Branches</div>' +
      '<div class="diff">' +
        Object.keys(BRANCHES).map(function (k) {
          return '<div class="c">  ' + BRANCHES[k].label + "</div>";
        }).join("") +
      "</div>" +
      '<div class="show-links">' +
        '<a class="lnk lnk-go" href="mailto:m49zhu@uwaterloo.ca">Email</a>' +
        '<a class="lnk" href="MATTHEW_ZHU_SWE.pdf">Resume · SWE</a>' +
        '<a class="lnk" href="MATTHEW_ZHU_MLE.pdf">Resume · MLE</a>' +
        '<a class="lnk" href="tutoring.html">Tutoring</a>' +

    if (!(auto && isSheet())) { showEl.classList.add("open"); }
  }

  /* ══ Branch filters ══════════════════════════════════════════════════════ */
  var nav = document.getElementById("branches");
  var label = document.createElement("div");
  label.className = "rail-label";
  label.textContent = "Branches";
  nav.appendChild(label);

  Object.keys(BRANCHES).forEach(function (k) {
    var b = BRANCHES[k];
    var n = LOG.filter(function (c) { return c.br === k; }).length;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "branch-btn";
    btn.style.setProperty("--c", b.color);
    btn.setAttribute("aria-pressed", "true");
    btn.innerHTML = '<span class="swatch"></span><span>' + b.label + '</span><span class="n">' + n + "</span>";

    btn.addEventListener("click", function () {
      if (k === "main") { return; }        /* main is the trunk; it always draws */
      enabled[k] = !enabled[k];
      btn.setAttribute("aria-pressed", String(enabled[k]));
      render();
    });

    nav.appendChild(btn);
  });

  var note = document.createElement("div");
  note.className = "rail-note";
  note.innerHTML = "Click a commit to read the diff.<br><br>" +
    "<kbd>j</kbd> <kbd>k</kbd> or <kbd>&#8593;</kbd><kbd>&#8595;</kbd> to move<br>" +
    "<kbd>esc</kbd> to close";
  nav.appendChild(note);

  /* ══ Keyboard ════════════════════════════════════════════════════════════ */
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) { return; }
    var list = visible();

    if (e.key === "Escape") { showEl.classList.remove("open"); return; }

    var dir = (e.key === "j" || e.key === "ArrowDown") ? 1
            : (e.key === "k" || e.key === "ArrowUp") ? -1 : 0;
    if (!dir) { return; }

    e.preventDefault();
    var i = list.indexOf(selected);
    i = i < 0 ? (dir > 0 ? 0 : list.length - 1) : Math.min(list.length - 1, Math.max(0, i + dir));
    select(list[i], list);
    rows[i].scrollIntoView({ block: "nearest" });
  });

  document.getElementById("btn-readme").addEventListener("click", showReadme);
  document.getElementById("close-show").addEventListener("click", function () {
    showEl.classList.remove("open");
  });

  /* Lane width changes at the mobile breakpoint, so re-read and redraw. */
  var rt = null;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var c2 = getComputedStyle(document.documentElement);
      LANE_W = parseFloat(c2.getPropertyValue("--lane-w"));
      ROW = parseFloat(c2.getPropertyValue("--row"));
      render();
    }, 140);
  });

  render();
  showReadme(true);
})();
</script>

</body>
</html>
